<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zavlo Care – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7f0fa;--sc:#f4f8fd;--cd:#fff;--ink:#0b2545;--mt:#62759a;--bl:#0a6cff;--tl:#12b886;--ln:#e0e9f5;--tn:#e7f1ff;--er:#e5304a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#050b17;--sc:#0b1630;--cd:#13213f;--ink:#eaf1ff;--mt:#93a5c9;--ln:#22345b;--tn:#1a2d54}}
:root[data-theme=dark]{--bg:#050b17;--sc:#0b1630;--cd:#13213f;--ink:#eaf1ff;--mt:#93a5c9;--ln:#22345b;--tn:#1a2d54}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);font:15px/1.4 Sora,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:56px}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
small{color:var(--mt);font-size:12px}h2{margin:2px 0 6px;font-size:21px;letter-spacing:-.3px}
.side{display:none;width:330px}
.side .tk{background:#050912;border-radius:24px;padding:10px;margin-bottom:18px}.side .tk img{width:100%;border-radius:16px;display:block}
.side button{display:flex;gap:10px;width:100%;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:600;text-align:left;color:var(--mt)}
.side button:hover,.side button.on{background:var(--cd);color:var(--bl)}.side button i{font-style:normal;opacity:.6;width:16px}
@media(min-width:980px){.side{display:block}}
.ph{position:relative;width:100%;max-width:392px;height:100%;max-height:840px;background:var(--sc);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.ph{height:min(840px,96%);border:9px solid #0d1830;border-radius:44px;box-shadow:0 30px 80px rgba(8,50,120,.3)}}
#v{flex:1;overflow-y:auto;padding:14px 16px 18px}#v.in{animation:in .28s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.fx{flex:1}.fx b{display:block}
.mk{height:34px;background:#fff;border-radius:11px;padding:2px}
.ib{width:38px;height:38px;border-radius:13px;background:var(--cd);box-shadow:0 2px 8px rgba(10,60,140,.1);font-size:17px}
.c{background:var(--cd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(10,60,140,.07);transition:transform .15s}
[data-a]:active{transform:scale(.98)}
.ai{background:linear-gradient(135deg,#0a4fd6,#0a9f9a);color:#fff}.ai small{color:#cfe8ff}
.fk{background:rgba(255,255,255,.18);border-radius:14px;padding:11px 13px;font-size:13px;margin-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g2 .c{margin:0;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}.g2 span{font-size:26px;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 6px 14px rgba(10,60,140,.14)}.g2 .c:nth-child(1) span{background:linear-gradient(135deg,#dbeafe,#93c5fd)}.g2 .c:nth-child(2) span{background:linear-gradient(135deg,#d1fae5,#6ee7b7)}.g2 .c:nth-child(3) span{background:linear-gradient(135deg,#fef3c7,#fcd34d)}.g2 .c:nth-child(4) span{background:linear-gradient(135deg,#fee2e2,#fca5a5)}
.fut{border:1.5px dashed var(--bl);background:var(--tn)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--bl);background:var(--cd);border-radius:20px;padding:3px 9px;margin-bottom:5px}
.b{display:flex;justify-content:center;gap:8px;align-items:center;width:100%;background:var(--bl);color:#fff;border-radius:16px;padding:14px;font-weight:700;box-shadow:0 8px 20px rgba(10,108,255,.3)}
.b.s{background:var(--tn);color:var(--bl);box-shadow:none}.b.r{background:var(--er)}
.ch{display:inline-block;background:var(--tn);color:var(--bl);border-radius:20px;padding:8px 12px;font-size:13px;font-weight:600;margin:0 6px 6px 0}.ch.on{background:var(--bl);color:#fff}
.nv{display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--ln)}
.nv button{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:600;color:var(--mt);gap:1px;padding:2px 10px}.nv span{font-size:20px}.nv .on{color:var(--bl)}
.pg{height:4px;background:var(--ln);border-radius:4px;margin-bottom:14px}.pg i{display:block;height:100%;background:var(--tl);border-radius:4px;transition:width .4s}
.fl{display:flex;gap:8px;align-items:center;background:var(--cd);border:1.5px solid var(--bl);border-radius:15px;padding:11px 13px;margin-bottom:12px}.fl input{flex:1;border:0;background:none;outline:0;min-width:0}
.rw{display:flex;align-items:center;gap:11px;background:var(--cd);border-radius:16px;padding:12px;margin-bottom:9px;width:100%;text-align:left}.rw>b{width:48px;height:48px;border-radius:16px;background:var(--tn);display:grid;place-items:center;font-size:25px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 4px 10px rgba(10,60,140,.12);filter:saturate(1.1)}.rw>div{flex:1;font-weight:600}.rw small{display:block;font-weight:400}
.rx{font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:6px;padding:1px 6px;margin-left:4px}
.q{display:flex;align-items:center;background:var(--tn);border-radius:12px}.q button{width:32px;height:34px;color:var(--bl);font-size:19px;font-weight:700}.q output{min-width:20px;text-align:center;font-weight:700}
.cb{position:sticky;bottom:0;display:flex;justify-content:space-between;background:var(--ink);color:var(--sc);border-radius:16px;padding:14px;font-weight:700;margin-top:8px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.em{text-align:center;padding:36px 12px;color:var(--mt)}.em span{font-size:44px;display:block;margin-bottom:6px}
.bb{max-width:86%;padding:11px 13px;border-radius:18px;margin-bottom:8px;font-size:14px}.bb.a{background:var(--cd);border-bottom-left-radius:5px}.bb.u{background:var(--bl);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mt);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px)}}
.sp{width:46px;height:46px;border:4px solid var(--ln);border-top-color:var(--bl);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto 12px}@keyframes rot{to{transform:rotate(1turn)}}
.ok{width:76px;height:76px;border-radius:50%;background:var(--tl);color:#fff;display:grid;place-items:center;font-size:38px;margin:0 auto 12px;animation:pop .5s}@keyframes pop{from{transform:scale(.3)}}
.er{background:#fde8eb;color:#b4182e;border-radius:14px;padding:12px;font-size:13px;margin-bottom:12px}
.up{border:2px dashed var(--bl);border-radius:20px;padding:30px 14px;text-align:center;background:var(--tn);color:var(--bl);font-weight:600;width:100%}
.st{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--mt);font-weight:600}.st i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:12px;font-style:normal;color:#fff;flex:none}.st.d{color:var(--ink)}.st.d i{background:var(--bl);border-color:var(--bl)}.st.n{color:var(--ink)}.st.n i{background:var(--tl);border-color:var(--tl);box-shadow:0 0 0 5px rgba(18,184,134,.25)}
.vd{height:300px;border-radius:24px;background:linear-gradient(160deg,#1c4b9a,#0a9f9a);position:relative;display:grid;place-items:center;font-size:84px;color:#fff;margin-bottom:12px}.vd small{position:absolute;bottom:62px;color:#d4ecff;font-size:12px}
.ct{position:absolute;bottom:12px;display:flex;gap:10px}.ct button{width:44px;height:44px;border-radius:50%;background:#fff;font-size:17px}.ct .x{background:var(--er);width:54px}.ct .f{opacity:.5}
.bd{position:absolute;top:12px;left:12px;font-size:12px;font-weight:700;background:#fff;color:#0b2545;border-radius:20px;padding:4px 10px}
.scr{position:absolute;inset:0;background:rgba(4,12,32,.5);opacity:0;pointer-events:none;transition:.25s;z-index:5}.scr.on{opacity:1;pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--cd);border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s;z-index:6;max-height:88%;overflow-y:auto}.sh.on{transform:none}
.ld{position:absolute;inset:0;background:var(--sc);z-index:7;display:grid;place-items:center;text-align:center}
.tt{position:absolute;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--ink);color:var(--sc);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:9;transition:.3s;max-width:88%;text-align:center}.tt.on{transform:translate(-50%,0)}
.spl{background:#fafafa;color:#0b2545;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.spl img{width:78%;max-width:300px}
.mp{background:linear-gradient(135deg,#dbe9fb,#eef5fd);border-radius:18px;margin:10px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

paid:()=>`<div class=em><div class=ok>✓</div><h2 style="color:var(--ink)">Order placed</h2><small>${S.ord.id} · station pickup</small></div><button class=b data-a=go:track>Track order</button>`,
track:()=>{const o=S.ord;if(!o)return `${hd('Order tracking')}<div class=em><span>📦</span><b>No active orders</b><br><small>Orders you place appear here.</small><br><br><button class="ch on" data-a=go:meds>Find medicine</button></div><button class="b s" data-a=drone>Preview future drone delivery</button>`;const L=['Order placed','Pharmacist check (simulated)','Packed at station','Ready for pickup'];
return `${hd('Order tracking')}<div class=c><b>${o.id}</b><br><small>${o.st}</small></div><div class=c>${L.map((l,i)=>`<div class="st ${i<o.k?'d':i==o.k?'n':''}"><i>${i<o.k?'✓':''}</i>${l}</div>`).join('')}</div>${o.k>=3?`<div class=c style="text-align:center">${qr(o.id)}<br><small>Demo pickup code</small></div><button class=b data-a=collect>Mark as collected</button>`:'<small>Updating automatically (demo timing).</small>'}<button class="b s" style="margin-top:10px" data-a=drone>Preview future drone delivery</button>`},
doc:()=>{const c=S.call;if(c==1)return `<div class=em style="padding-top:110px"><div class=sp></div><b style="color:var(--ink)">Connecting to demo consult…</b></div>`;
if(c==2)return `${hd('Telemedicine')}<div class=vd><span class=bd>● Live · <span id=tm>00:00</span></span>👩‍⚕️<small>Simulated clinician (placeholder)</small><div class=ct><button class="${S.mic?'':'f'}" data-a=mic>🎤</button><button class="${S.cam?'':'f'}" data-a=cam>🎥</button><button class=x data-a=end>📞</button></div></div><small>Demo screen. No real clinician or patient data.</small>`;
if(c==3)return `${hd('Telemedicine')}<div class=em><div class=ok>✓</div><b style="color:var(--ink)">Consult ended</b><br><small>A live service would provide notes and any e-prescription.</small></div><button class=b data-a=go:profile>View profile</button>`;
return `${hd('Telemedicine')}<div class=c><b>Video consult (demo)</b><br><small>Try the flow with a simulated clinician. Medical emergencies need local emergency services.</small></div><b>Book a slot</b><div style="margin:8px 0">${['Today 4:30 PM','Today 6:00 PM','Tomorrow 9:00 AM'].map(x=>`<button class="ch ${S.slot==x?'on':''}" data-a="slot:${x}">${x}</button>`).join('')}</div><button class=b data-a=start>Start demo consult now</button>`},
profile:()=>`${hd('Profile')}<div class=rw><b>👤</b><div>Demo User<small>demo@zavlo.example</small></div></div><h2 style="font-size:16px;margin-top:14px">Prescriptions</h2>${S.rx?'<div class=rw><b>📄</b><div>Demo prescription<small>Verified in this session</small></div></div>':'<div class=em style="padding:14px"><small>No prescriptions yet. They appear after verification.</small></div>'}<h2 style="font-size:16px">Orders</h2>${S.orders.length?S.orders.map(o=>`<div class=rw><b>🛍️</b><div>${o.id}<small>${o.items} · Collected</small></div></div>`).join(''):'<div class=em style="padding:14px"><small>No completed orders yet.</small></div>'}<div class=c style="background:#050912;margin-top:12px"><img src="${TK}" style="width:100%;border-radius:12px" alt=""><small style="color:#9db3d8">Zavlo Care is a concept by Zavlo Technologies. Mock data only.</small></div><button class="b s" data-a=reset>Reset demo</button>`
};
function render(n){const v=$('#v');const s=S.s;v.innerHTML=V[s]();if(!n){v.className='';void v.offsetWidth;v.className='in'}
 const nv=$('#nv');nv.style.display=(s=='splash'||(s=='doc'&&S.call>0&&S.call<3)||s=='paid')?'none':'flex';
 nv.innerHTML=[['home','🏠','Home'],['ai','✨','Assistant'],['track','📦','Orders'],['doc','🧑‍⚕️','Doctor'],['profile','👤','Profile']].map(x=>`<button data-a=nav:${x[0]} class="${s==x[0]?'on':''}"><span>${x[1]}</span>${x[2]}</button>`).join('');
 const k=J.findIndex(x=>x[1]==s);$('#sd').innerHTML=J.map((x,i)=>`<button data-a=jump:${x[1]} class="${i==k?'on':''}"><i>${i+1}</i>${x[0]}</button>`).join('');
 if(s=='ai')v.scrollTop=v.scrollHeight}
function go(s){if(s!=S.s){if(S.s!='splash'&&S.s!='paid')S.h.push(S.s);S.s=s}render()}
function upd(){$('#ml').innerHTML=mlist();$('#cb').innerHTML=cbar()}
function reply(t){t=t.toLowerCase();
 if(/head|pain|fever/.test(t))return{t:"I can't diagnose, but for mild headaches many people use over-the-counter options, following the label. If symptoms are severe, sudden or don't improve, speak to a clinician or emergency services.",a:[['Find pain relief','meds','para'],['Talk to a clinician','doc']]};
 if(/refill|prescri|antibio|amox/.test(t))return{t:"Prescription-only items need a valid prescription. You can upload one and a pharmacist check is simulated in this demo.",a:[['Find medicine','meds','amox'],['Upload prescription','rx']]};
 if(/allerg|sneez/.test(t))return{t:"Antihistamines are commonly sold for allergy relief. Check the label and ask a pharmacist or clinician if you're unsure it suits you.",a:[['Find allergy relief','meds','allerg'],['Talk to a clinician','doc']]};
 if(/doctor|clinic|talk|appoint/.test(t))return{t:"You can start a demo video consult or book a slot. For emergencies, contact your local emergency number.",a:[['Open telemedicine','doc']]};
 return{t:"I can help you find medicines, understand the pickup flow or connect you to a clinician. What would you like to do?",a:[['Find medicine','meds'],['Telemedicine','doc']]}}
const A={
noop(){},go(p){go(p)},nav(p){S.h=[];go(p)},back(){S.s=S.h.pop()||'home';if(S.s=='splash')S.s='home';render()},cl,
jump(p){if(['rx','station','checkout','pay'].includes(p)&&!tot())S.cart={2:1};if(p=='rx')S.rxs=0;if(['checkout','pay'].includes(p)){S.rx=1;S.rxs=2;S.st=S.st||'a'}S.h=[];go(p)},
add(p){S.cart[p]=(S.cart[p]||0)+1;upd()},sub(p){S.cart[p]=Math.max(0,(S.cart[p]||0)-1);upd()},clr(){S.q='';$('#v').innerHTML=V.meds();},
cont(){if(needRx()&&!S.rx){S.rxs=0;go('rx')}else go('station')},
ff(){S.fail=!S.fail},
rxup(){S.rxs=1;render();setTimeout(()=>{if(S.s!='rx')return;S.rxs=S.fail?3:2;S.rx=S.fail?0:1;render()},1900)},
st(p){if(!ST.find(s=>s.id==p).o){toast('This station is closed. Choose another.');return}S.st=p;render()},
tocheck(){if(!S.st){toast('Select a station first');return}go('checkout')},
pm(p){S.pay=p;render()},
paynow(){$('#ph').insertAdjacentHTML('beforeend','<div class=ld id=ld><div><div class=sp></div><b>Processing payment…</b></div></div>');setTimeout(()=>{$('#ld').remove();if(S.fail){S.perr=1;S.fail=0;render();return}S.perr=0;const id='ZC-'+(1000+Math.floor(Math.random()*9000));S.ord={id,k:0,st:'Station pickup · demo order',items:cart().map(m=>m.n).join(', ')};S.cart={};clearInterval(PT);PT=setInterval(()=>{if(S.ord&&S.ord.k<3){S.ord.k++;if(S.s=='track')render()}},2200);S.s='paid';S.h=[];render()},1800)},
collect(){S.orders.unshift({id:S.ord.id,items:S.ord.items});S.ord=null;clearInterval(PT);toast('Order collected. Thank you!');render()},
async send(p){if(S.typ)return;const i=$('#ci'),t=(p||(i&&i.value)||'').trim();if(!t){toast('Type a question first');return}S.chat.push({t});S.typ=1;render();const k=reply(t);
 if(!SM){setTimeout(()=>{S.typ=0;S.chat.push({b:1,...k});if(S.s=='ai')render()},1100);return}
 const msg={b:1,t:'',a:k.a};let tn=S.chat.slice(1).filter(m=>m.t||!m.b).slice(-7).map(m=>({role:m.b?'assistant':'user',content:m.b?m.t.replace(/<br>/g,'\n'):m.t}));while(tn.length&&tn[0].role!='user')tn.shift();tn[0].content=INSTR+'\n\nConversation:\n'+tn[0].content;
 const show=x=>{if(S.typ){S.typ=0;S.chat.push(msg)}msg.t=esc(x).replace(/\n/g,'<br>');if(S.s=='ai')render(1)};
 try{const r=await SM(tn,{cache:false,modelTier:'quick',onText:({text})=>show(text)});show(r.text||k.t)}catch(e){show(k.t)}},
ask(p,r){if(p=='meds')S.q=r||'';go(p)},
slot(p){S.slot=p;toast('Slot booked (demo): '+p);render()},
start(){S.call=1;render();setTimeout(()=>{S.call=2;S.sec=0;S.mic=S.cam=1;clearInterval(TM);TM=setInterval(()=>{S.sec++;const e=$('#tm');if(e)e.textContent=String(S.sec/60|0).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0')},1000);render()},1600)},
mic(){S.mic=!S.mic;toast(S.mic?'Mic on':'Mic muted');render()},cam(){S.cam=!S.cam;toast(S.cam?'Camera on':'Camera off');render()},
end(){clearInterval(TM);S.call=3;render()},
reset(){clearInterval(PT);clearInterval(TM);S=S0();S.s='home';render();toast('Demo reset')},
em(){sheet('<h2>🚑 Emergency</h2><p>If someone is in danger, contact your local emergency number now. This app cannot send help in this demo.</p><button class="b r" data-a=dial>Call emergency number</button>')},
dial(){cl();toast('Demo: this would open your phone dialer')},
drone(){sheet(`<span class=tag>FUTURE · PILOT CONCEPT</span><h2>Drone delivery</h2><svg class=mp viewBox="0 0 320 140" width=100%><path d="M30 110C90 20 170 130 280 36" stroke="#12b8a6" stroke-width="4" fill="none" stroke-dasharray="6 6"/><text x=18 y=124 font-size=22>🏥</text><text x=270 y=34 font-size=22>🏠</text><text font-size=24 text-anchor=middle><animateMotion dur=5s repeatCount=indefinite path="M30 110C90 20 170 130 280 36"/>🚁</text></svg><p><small>Visualisation only. Drone delivery is not available. It would need regulatory approval, safety validation and delivery partners.</small></p><button class=b data-a=cl>Got it</button>`)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName=='INPUT')return;const[a,p,r]=t.dataset.a.split(':');if(a=='send'&&!p&&t.id)return;(A[a]||A.noop)(p,r)});
document.addEventListener('change',e=>{if(e.target.dataset.a=='ff')A.ff()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;upd()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci')A.send()});
['em','drone'].forEach(k=>{const o=A.go;});
A.go=function(p){if(p=='em')return A.em();go(p)};
try{window.claude&&claude.use('sample').then(s=>{SM=s;if(S.s=='ai')render(1)}).catch(()=>{})}catch(e){}
render();
</script></body></html>
